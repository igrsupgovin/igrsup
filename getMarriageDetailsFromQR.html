 //Prevents backspace except in the case of textareas and text inputs to prevent user navigation.
    $(document).keydown(function (e) {
        var preventKeyPress;
        if (e.keyCode == 8) {
            var d = e.srcElement || e.target;
            switch (d.tagName.toUpperCase()) {
                case 'TEXTAREA':
                    preventKeyPress = d.readOnly || d.disabled;
                    break;
                case 'INPUT':
                    preventKeyPress = d.readOnly || d.disabled ||
                        (d.attributes["type"] && $.inArray(d.attributes["type"].value.toLowerCase(), ["radio", "checkbox", "submit", "button"]) >= 0);
                    break;
                case 'DIV':
                    preventKeyPress = d.readOnly || d.disabled || !(d.attributes["contentEditable"] && d.attributes["contentEditable"].value == "true");
                    break;
                default:
                    preventKeyPress = true;
                    break;
            }
        }
        else
            preventKeyPress = false;

        if (preventKeyPress)
            e.preventDefault();
    });

<script type="text/javascript">
(function () {
  "use strict";
  var DB_NAME = "PersonalMarriageRecordDB";
  var STORE_NAME = "records";
  var fields = {
    recordApplication: "app", recordGroom: "groom", recordBride: "bride",
    recordVenue: "venue", recordDistrict: "district", recordTehsil: "tehsil",
    recordSubreg: "subreg", recordEventDate: "eventDate", recordRegno: "regno",
    recordRegdate: "regdate"
  };
  function showMessage(message) {
    var el = document.getElementById("recordMessage");
    el.textContent = message;
    el.style.display = "block";
  }
  function openDatabase() {
    return new Promise(function (resolve, reject) {
      var request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = function () {
        var db = request.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME, { keyPath: "id" });
        }
      };
      request.onsuccess = function () { resolve(request.result); };
      request.onerror = function () { reject(request.error); };
    });
  }
  function readRecord(db, id) {
    return new Promise(function (resolve, reject) {
      var request = db.transaction(STORE_NAME, "readonly").objectStore(STORE_NAME).get(id);
      request.onsuccess = function () { resolve(request.result); };
      request.onerror = function () { reject(request.error); };
    });
  }
  function displayRecord(record) {
    Object.keys(fields).forEach(function (elementId) {
      var element = document.getElementById(elementId);
      var value = record[fields[elementId]];
      element.textContent = value ? String(value) : "—";
    });
  }
  var recordId = new URLSearchParams(window.location.search).get("ano");
  if (!recordId) {
    showMessage("रिकॉर्ड ID URL में उपलब्ध नहीं है। रिकॉर्ड प्रबंधन पेज से विवरण खोलें।");
    return;
  }
  if (!window.indexedDB) {
    showMessage("इस ब्राउज़र में स्थानीय रिकॉर्ड डेटाबेस उपलब्ध नहीं है।");
    return;
  }
  openDatabase().then(function (db) {
    return readRecord(db, recordId);
  }).then(function (record) {
    if (!record) {
      showMessage("इस रिकॉर्ड ID से कोई जानकारी नहीं मिली: " + recordId);
      return;
    }
    displayRecord(record);
  }).catch(function (error) {
    showMessage("रिकॉर्ड लोड नहीं हो सका: " + (error && error.message ? error.message : "अज्ञात त्रुटि"));
  });
})();
</script>
